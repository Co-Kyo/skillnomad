<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="caseTitle">
  <title id="caseTitle">案例对照：sp-skill 的 Before / After（实测）</title>
  <defs>
    <marker id="ba" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>.t{font-family:'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
  <rect width="900" height="430" fill="#FFFFFF"/>

  <!-- Before -->
  <text x="10" y="26" class="t" font-size="14" font-weight="700" fill="#993C1D">还是 plaintext 时</text>
  <g text-anchor="middle" class="t">
    <rect x="10" y="38" width="164" height="62" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="92" y="64" font-size="16" font-weight="700" fill="#993C1D">14.7 万</text>
    <text x="92" y="86" font-size="12" fill="#993C1D">markdown 总字符（51 个 .md）</text>
    <rect x="184" y="38" width="164" height="62" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="266" y="64" font-size="16" font-weight="700" fill="#993C1D">8,506</text>
    <text x="266" y="86" font-size="12" fill="#993C1D">最大单文件字符</text>
    <rect x="358" y="38" width="164" height="62" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="440" y="64" font-size="16" font-weight="700" fill="#993C1D">0</text>
    <text x="440" y="86" font-size="12" fill="#993C1D">测试 · 类型 · schema</text>
    <rect x="532" y="38" width="164" height="62" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="614" y="64" font-size="16" font-weight="700" fill="#993C1D">全内联</text>
    <text x="614" y="86" font-size="12" fill="#993C1D">序号·引用·路径</text>
    <rect x="706" y="38" width="164" height="62" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
    <text x="788" y="64" font-size="16" font-weight="700" fill="#993C1D">人眼</text>
    <text x="788" y="86" font-size="12" fill="#993C1D">成环断链靠查</text>
  </g>

  <!-- 中轴强调 -->
  <rect x="110" y="118" width="680" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="450" y="141" text-anchor="middle" class="t" font-size="16" font-weight="700" fill="#0C447C">skillnomad 打包后，AI 拿到的 markdown 对齐（本例 diff 为零）</text>
  <text x="450" y="161" text-anchor="middle" class="t" font-size="12" fill="#185FA5">产物是纯 markdown · 与 plaintext 版逐字对齐 · 机制藏在幕后，不进 AI 的上下文</text>
  <path d="M450 176 L450 194" fill="none" stroke="#EA580C" stroke-width="2" marker-end="url(#ba)"/>

  <!-- After -->
  <text x="10" y="222" class="t" font-size="14" font-weight="700" fill="#085041">代码化之后 · 同一个 sp-skill（AI 视角：markdown 不变）</text>
  <g text-anchor="middle" class="t">
    <rect x="10" y="234" width="164" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="92" y="260" font-size="16" font-weight="700" fill="#085041">-38%</text>
    <text x="92" y="282" font-size="12" fill="#085041">流程骨架体量</text>
    <rect x="184" y="234" width="164" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="266" y="260" font-size="16" font-weight="700" fill="#085041">-64%</text>
    <text x="266" y="282" font-size="12" fill="#085041">最大单文件</text>
    <rect x="358" y="234" width="164" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="440" y="260" font-size="16" font-weight="700" fill="#085041">0 → 8</text>
    <text x="440" y="282" font-size="12" fill="#085041">测试文件</text>
    <rect x="532" y="234" width="164" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="614" y="260" font-size="16" font-weight="700" fill="#085041">全派生</text>
    <text x="614" y="282" font-size="12" fill="#085041">改一处全同步</text>
    <rect x="706" y="234" width="164" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="788" y="260" font-size="16" font-weight="700" fill="#085041">48 次</text>
    <text x="788" y="282" font-size="12" fill="#085041">演进可回溯（main 口径）</text>
  </g>

  <!-- 底部口径 -->
  <line x1="10" y1="322" x2="890" y2="322" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="450" y="352" text-anchor="middle" class="t" font-size="13" fill="#475569">数字全部可复现（wc -m 口径）· 校验覆盖契约内规则，契约外行为与 plaintext 版一致</text>
  <rect x="215" y="372" width="470" height="40" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="0.8"/>
  <text x="450" y="390" text-anchor="middle" class="t" font-size="12" font-weight="600" fill="#9A3412">案例：sp-skill —— 官方示例 · 团队自用 skill · 目前唯一的完整案例</text>
  <text x="450" y="406" text-anchor="middle" class="t" font-size="11" fill="#9A3412">适合持续迭代的长流程 skill；小 skill / 一次性 skill 用不上</text>
</svg>

name: Release skillnomad

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: false
        default: "v0.2.0"

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Checkout release ref
        run: |
          git fetch --tags --force
          git checkout "$RELEASE_TAG"

      - name: Version gate
        id: version-gate
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          # Ancestry 门：tag 必须指向 main 历史上的 commit，防止绕过分支保护
          # 直接推 tag 发布（tag 推送不受分支保护限制）。不满足则静默跳过发布。
          git fetch origin main --depth=50
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=tag-not-on-main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASE_VERSION=$(node -p "require('./release-manifest.json').release")
          if [ "$VERSION" != "$RELEASE_VERSION" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=version-mismatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_release=false
          for pkg in \
            packages/skillnomad-types \
            packages/skillnomad-common \
            packages/skillnomad \
            packages/skillnomad-validate
          do
            name=$(node -p "require('./$pkg/package.json').name")
            package_version=$(node -p "require('./$pkg/package.json').version")
            manifest_version=$(node -p "require('./release-manifest.json').packages['$name']")
            if [ "$package_version" != "$manifest_version" ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "reason=package-version-mismatch" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if npm view "$name@$manifest_version" --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "exists $name@$manifest_version"
            else
              echo "missing $name@$manifest_version"
              should_release=true
            fi
          done

          if gh api "repos/Co-Kyo/skillnomad/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release exists"
          else
            echo "release missing"
            should_release=true
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Install and verify
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          npm ci
          npm run build
          npm run typecheck

      - name: Ensure npm supports Trusted Publishing
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          npm install -g npm@11.5.1 || (sleep 15 && npm install -g npm@11.5.1)
          npm --version

      - name: Publish npm packages (Trusted Publishing / OIDC)
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          for pkg in \
            packages/skillnomad-types \
            packages/skillnomad-common \
            packages/skillnomad \
            packages/skillnomad-validate
          do
            name=$(node -p "require('./$pkg/package.json').name")
            manifest_version=$(node -p "require('./release-manifest.json').packages['$name']")
            if npm view "$name@$manifest_version" >/dev/null 2>&1; then
              echo "exists $name@$manifest_version"
            else
              # 预发布版本（含 "-"）走 beta dist-tag，不占 latest
              if [[ "$manifest_version" == *-* ]]; then
                npm publish --workspace "$pkg" --access public --tag beta
              else
                npm publish --workspace "$pkg" --access public
              fi
            fi
          done

      - name: Pack release artifacts
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist-release
          git archive --format=zip -o dist-release/source.zip "$RELEASE_TAG"
          for pkg in \
            packages/skillnomad-types \
            packages/skillnomad-common \
            packages/skillnomad \
            packages/skillnomad-validate
          do
            npm pack --workspace "$pkg" --pack-destination dist-release
          done

      - name: Extract release notes from CHANGELOG
        if: steps.version-gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          # 正式版正文从 CHANGELOG 对应版本节提取（按 "## vX.Y.Z" 切段），
          # beta 沿用自动 notes。单真相源：发版只改 CHANGELOG，不可能再忘同步。
          # （2026-09-04 教训：v0.1.1 沿用固定 RELEASE_NOTES.md，Release 页正文误贴 v0.1.0）
          if [[ "$RELEASE_TAG" == *-* ]]; then
            : > dist-release/NOTES.md
          else
            VERSION="${RELEASE_TAG#v}"
            awk -v ver="## v$VERSION" '
              $0 ~ /^## v/ { in_sec = ($0 ~ ver) }
              in_sec { print }
            ' CHANGELOG.md | awk '/^## v/ && ++c > 1 { exit } { print }' > dist-release/NOTES.md
            if ! grep -q . dist-release/NOTES.md; then
              echo "CHANGELOG 缺少 $RELEASE_TAG 对应版本节" >&2
              exit 1
            fi
          fi

      - name: Create GitHub Release
        if: steps.version-gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # 标题：beta 沿用版本号；v0.1.0 用首个稳定版定位标题；其余正式版用 plain 版本号
          name: ${{ contains(env.RELEASE_TAG, '-') && env.RELEASE_TAG || (env.RELEASE_TAG == 'v0.1.0' && format('{0} · 首个稳定版（可信度里程碑）', env.RELEASE_TAG) || env.RELEASE_TAG) }}
          # 正文：正式版用 CHANGELOG 对应版本节（上一步提取），beta 走自动生成 notes
          body_path: ${{ contains(env.RELEASE_TAG, '-') && '' || 'dist-release/NOTES.md' }}
          # Prerelease 徽章：beta 标黄 "Pre-release"，正式版无徽章——版本线在 Releases 页第一眼可辨
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            dist-release/source.zip
            dist-release/*.tgz
          generate_release_notes: true
